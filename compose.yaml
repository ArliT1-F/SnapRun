services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snaprun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: snaprun
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - snaprun_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snaprun -d snaprun']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  snaprun_postgres:
