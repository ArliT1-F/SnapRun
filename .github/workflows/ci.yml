name: Verify SnapRun
on:
  push:
    branches: ['arena/ffd3ee89-snaprun', main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: snaprun
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: snaprun_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test against real PostgreSQL
        run: npm run test -w @snaprun/server
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgresql://snaprun:ci-only-password@localhost:5432/snaprun_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Install browser for smoke test
        run: npx --yes playwright@1.65.0 install --with-deps chromium
      - name: Browser smoke against compiled application
        run: |
          SERVE_WEB=true PORT=5173 node apps/server/dist/index.js > /tmp/snaprun-ci.log 2>&1 &
          echo $! > /tmp/snaprun-ci.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:5173 npm run test:browser
          kill "$(cat /tmp/snaprun-ci.pid)"
